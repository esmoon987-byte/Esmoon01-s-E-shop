<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaZ market - Herní Obchod</title>
    <link rel="icon" href="logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Ubuntu:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #f0f0f0;
            font-family: 'Ubuntu', sans-serif;
            padding-bottom: 60px;
            position: relative;
        }

        .top-accent {
            height: 6px;
            background: linear-gradient(90deg, #ffffff, #888888);
            width: 100%;
        }

        header {
            background-color: #0d0d0d;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #222222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header-buttons-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            gap: 10px;
        }

        .btn-cart-toggle {
            background-color: #222222;
            border: 3px solid #444444;
            border-bottom-color: #111111;
            border-right-color: #111111;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 10pt;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-cart-toggle:hover {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 576px) {
            .products-grid { grid-template-columns: 1fr; }
        }

        .product-card {
            background-color: #1c1c1c;
            border: 3px solid #2d2d2d;
            border-bottom-color: #0d0d0d;
            border-right-color: #0d0d0d;
            padding: 20px;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #ffffff;
        }

        .product-card.sold-out-card {
            opacity: 0.6;
            border-color: #444444;
        }

        .product-card.sold-out-card:hover {
            transform: none;
            border-color: #444444;
        }

        .sold-out-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff3333;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 6pt;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .product-image {
            width: 64px;
            height: 64px;
            margin: 10px auto 20px auto;
            image-rendering: pixelated;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .product-title {
            font-weight: bold;
            font-size: 13pt;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .product-rarity {
            font-size: 9pt;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .product-rarity.uncommon { color: #55ff55; }
        .product-rarity.rare { color: #55ffff; }
        .product-rarity.common { color: #aaaaaa; }

        .product-price {
            font-family: 'VT323', monospace;
            font-size: 20pt;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 1px 1px 0px #333;
        }

        .btn-add {
            width: 100%;
            background-color: #2a2a2a;
            border: 2px solid #444444;
            border-bottom-color: #050505;
            border-right-color: #050505;
            color: #fff;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        .btn-add:hover:not(:disabled) {
            background-color: #ffffff;
            color: #000;
            border-color: #ffffff;
        }

        .btn-add:disabled {
            background-color: #222222;
            border-color: #333333;
            color: #666666;
            cursor: not-allowed;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background-color: #141414;
            border-left: 4px solid #252525;
            box-shadow: -5px 0 25px rgba(0,0,0,0.7);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open { right: 0; }

        .cart-header {
            padding: 20px;
            background-color: #0d0d0d;
            border-bottom: 3px solid #222222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 11pt;
            color: #ffffff;
        }

        .btn-close-cart {
            background: transparent;
            border: none;
            color: #ff5555;
            font-size: 20pt;
            cursor: pointer;
        }

        .cart-items-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-empty-msg {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            background-color: #1a1a1a;
            padding: 12px;
            border: 2px solid #2d2d2d;
            margin-bottom: 10px;
        }

        .cart-item-img {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            image-rendering: pixelated;
        }

        .cart-item-details { flex: 1; }
        .cart-item-title { font-weight: bold; font-size: 10pt; }
        .cart-item-price { color: #ffffff; font-size: 9pt; }
        
        .cart-item-remove {
            background: none;
            border: none;
            color: #ff5555;
            cursor: pointer;
            font-weight: bold;
            font-size: 14pt;
            padding: 0 5px;
        }

        .cart-footer {
            padding: 20px;
            background-color: #0d0d0d;
            border-top: 3px solid #222222;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 12pt;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .cart-total-price {
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 20pt;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 8pt; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
        
        .form-input {
            width: 100%;
            background-color: #1c1c1c;
            border: 2px solid #333333;
            color: #fff;
            padding: 10px;
        }

        .command-box-container {
            background-color: #050505;
            border: 1px dashed #555;
            padding: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .command-label { font-size: 8pt; color: #ffffff; margin-bottom: 4px; font-weight: bold; }
        .command-text-row { display: flex; align-items: center; }
        .command-code { font-family: monospace; color: #aaaaaa; font-size: 9pt; flex: 1; overflow-x: auto; }
        
        .btn-copy { background-color: #222; border: 1px solid #444; color: #fff; font-size: 8pt; padding: 4px 8px; cursor: pointer; }
        .btn-copy:hover { background-color: #fff; color: #000; }

        .file-input-wrapper {
            background-color: #1c1c1c;
            border: 2px dashed #444;
            padding: 10px;
            text-align: center;
        }

        .btn-order {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #ffffff;
            border-bottom-color: #888888;
            border-right-color: #888888;
            padding: 14px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8pt;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.1s ease;
        }

        .btn-order:hover:not(:disabled) {
            background-color: #e0e0e0;
            border-color: #e0e0e0;
        }

        .btn-order:disabled { background-color: #333; border-color: #444; color: #666; cursor: not-allowed; }

        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 999; display: none;
        }
        .cart-overlay.open { display: block; }
        footer { text-align: center; color: #555; font-size: 9pt; margin-top: 40px; padding: 20px; }
        footer a { color: #888; text-decoration: none; }
        footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-accent"></div>
    
    <div class="header-buttons-container">
        <a href="kontakt.html" class="btn-cart-toggle">Kontakt</a>
        <button class="btn-cart-toggle" onclick="toggleCart()">
            Košík (<span id="cart-count-nav">0</span>)
        </button>
    </div>
    
    <header>
        <div class="logo-container" style="display: flex; align-items: center; justify-content: center; gap: 25px;">
            <img src="logo.png?v=2" alt="E&Z Logo" style="width: 120px; height: auto; display: block; border-radius: 6px;">
            <div>
                <h1 style="font-family: 'Press Start 2P', cursive; font-size: 24pt; color: #ffffff; text-shadow: 3px 3px 0px #3f3f3f; margin: 0; letter-spacing: 1px;">
                    E&Z market
                </h1>
            </div>
        </div>
        <p style="font-size: 11pt; color: #aaaaaa; max-width: 600px; margin: 15px auto 0 auto;">
            Vyber si předměty, zaplať na serveru přes /paybusiness, nahraj screenshot.
        </p>
    </header>

    <div class="container">
        <div class="products-grid" id="products-grid"></div>
    </div>

    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>🛒 TVŮJ KOŠÍK</h2>
            <button class="btn-close-cart" onclick="toggleCart()">&times;</button>
        </div>

        <div class="cart-items-container" id="cart-items-container"></div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>CELKEM:</span>
                <span class="cart-total-price" id="cart-total-price">0 $</span>
            </div>

            <div class="command-box-container" id="command-box-container">
                <div class="command-label">KROK 1: ZAPLAŤ NA SERVERU</div>
                <div class="command-text-row">
                    <div class="command-code" id="command-code">/paybusiness EaZ_market 0 0</div>
                    <button class="btn-copy" onclick="copyCommand()">Kopírovat</button>
                </div>
            </div>

            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label for="player-name">Tvoje Herní Jméno (Nick)</label>
                    <input type="text" id="player-name" class="form-input" placeholder="Např. Notch" required>
                </div>
                <div class="form-group">
                    <label for="player-coords">Doručovací souřadnice (X, Y, Z)</label>
                    <input type="text" id="player-coords" class="form-input" placeholder="Např. X: 120, Y: 64, Z: -350" required>
                </div>
                <div class="form-group">
                    <label for="player-proof">KROK 2: SCREENSHOT PLATBY</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="player-proof" accept="image/*" required>
                    </div>
                </div>
                <button type="submit" class="btn-order" id="btn-submit-order" disabled>ODESLAT OBJEDNÁVKU</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 EaZ market. Minecraft je ochranná známka Mojang Synergies AB.</p>
        <a href="podminky.html">Obchodni podminky</a>
    </footer>

    <script>
        const IMGBB_API_KEY = "bd4cb6403ae8aff89e11dc486c14c106";
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1542521408125407284/Q5oNIox62Nt9uqeHVRXz-kWVoV1Cdo_vtMjDNP9SQE3sRPn2pBGLGgV6NCDVnGXPedmB";

        const BASE_BLOCK = "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20/assets/minecraft/textures/block";
        const BASE_ITEM  = "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20/assets/minecraft/textures/item";

        // VŠECHNY TVÉ PRODUKTY JSOU ZPÁTKY
        const PRODUCTS = [
            { id: 1,  name: "sugar cane 64x",        price: 1000, rarity: "common",   img: `${BASE_ITEM}/sugar_cane.png`,            outOfStock: true },  
            { id: 2,  name: "dirt 64x",              price: 500,  rarity: "common",   img: `${BASE_BLOCK}/dirt.png`,                 outOfStock: false },
            { id: 3,  name: "oak log 64x",           price: 2750, rarity: "common",   img: `${BASE_BLOCK}/oak_log.png`,              outOfStock: false },
            { id: 4,  name: "cobbled deepslate 64x", price: 500,  rarity: "common",   img: `${BASE_BLOCK}/cobbled_deepslate.png`,    outOfStock: false },

            { id: 6,  name: "diorite 64x",           price: 1200, rarity: "common",   img: `${BASE_BLOCK}/diorite.png`,              outOfStock: false },
            { id: 7,  name: "granite 64x",           price: 1200, rarity: "common",   img: `${BASE_BLOCK}/granite.png`,              outOfStock: false },
            { id: 8,  name: "stone bricks 64x",      price: 2000, rarity: "common",   img: `${BASE_BLOCK}/stone_bricks.png`,         outOfStock: false },
            { id: 9,  name: "deepslate bricks 64x",  price: 2000, rarity: "common",   img: `${BASE_BLOCK}/deepslate_bricks.png`,     outOfStock: true },
            { id: 10, name: "white concrete 64x",    price: 2400, rarity: "common",   img: `${BASE_BLOCK}/white_concrete.png`,       outOfStock: true },  
            { id: 11, name: "orange concrete 64x",   price: 2400, rarity: "common",   img: `${BASE_BLOCK}/orange_concrete.png`,      outOfStock: true },  
            { id: 12, name: "magenta concrete 64x",  price: 2400, rarity: "common",   img: `${BASE_BLOCK}/magenta_concrete.png`,     outOfStock: true },
            { id: 13, name: "light blue concrete 64x",price: 2400, rarity: "common",  img: `${BASE_BLOCK}/light_blue_concrete.png`,  outOfStock: true },
            { id: 14, name: "yellow concrete 64x",   price: 2400, rarity: "common",   img: `${BASE_BLOCK}/yellow_concrete.png`,      outOfStock: true },
            { id: 15, name: "lime concrete 64x",     price: 2400, rarity: "common",   img: `${BASE_BLOCK}/lime_concrete.png`,        outOfStock: true },
            { id: 16, name: "pink concrete 64x",     price: 2400, rarity: "common",   img: `${BASE_BLOCK}/pink_concrete.png`,        outOfStock: true },
            { id: 17, name: "gray concrete 64x",     price: 2400, rarity: "common",   img: `${BASE_BLOCK}/gray_concrete.png`,        outOfStock: true },
            { id: 18, name: "light gray concrete 64x", price: 2400, rarity: "common", img: `${BASE_BLOCK}/light_gray_concrete.png`,  outOfStock: true },
            { id: 19, name: "cyan concrete 64x",     price: 2400, rarity: "common",   img: `${BASE_BLOCK}/cyan_concrete.png`,        outOfStock: true },
            { id: 20, name: "purple concrete 64x",   price: 2400, rarity: "common",   img: `${BASE_BLOCK}/purple_concrete.png`,      outOfStock: true },
            { id: 21, name: "blue concrete 64x",     price: 2400, rarity: "common",   img: `${BASE_BLOCK}/blue_concrete.png`,        outOfStock: true },
            { id: 22, name: "brown concrete 64x",    price: 2400, rarity: "common",   img: `${BASE_BLOCK}/brown_concrete.png`,       outOfStock: true },
            { id: 23, name: "green concrete 64x",    price: 2400, rarity: "common",   img: `${BASE_BLOCK}/green_concrete.png`,       outOfStock: true },
            { id: 24, name: "red concrete 64x",      price: 2400, rarity: "common",   img: `${BASE_BLOCK}/red_concrete.png`,         outOfStock: true },
            { id: 25, name: "black concrete 64x",    price: 2400, rarity: "common",   img: `${BASE_BLOCK}/black_concrete.png`,       outOfStock: true },
            { id: 26, name: "stone 64x",             price: 1500, rarity: "common",   img: `${BASE_BLOCK}/stone.png`,                outOfStock: false }, 
            { id: 27, name: "cobblestone 64x",       price: 500,  rarity: "common",   img: `${BASE_BLOCK}/cobblestone.png`,          outOfStock: false }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;

            grid.innerHTML = PRODUCTS.map(p => {
                const isSoldOut = p.outOfStock === true;

                return `
                    <div class="product-card ${isSoldOut ? 'sold-out-card' : ''}">
                        ${isSoldOut ? '<div class="sold-out-badge">VYPRODÁNO</div>' : ''}
                        <div class="product-rarity ${p.rarity}">${p.rarity}</div>
                        <div class="product-image"><img src="${p.img}" alt="${p.name}"></div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${isSoldOut ? 'VYPRODÁNO' : p.price + ' $'}</div>
                        <button class="btn-add" 
                                onclick="addToCart(${p.id})" 
                                ${isSoldOut ? 'disabled' : ''}>
                            ${isSoldOut ? 'VYPRODÁNO' : 'Přidat'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('open');
        }

        function addToCart(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product || product.outOfStock) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count-nav').innerText = totalCount;
            
            const container = document.getElementById('cart-items-container');
            const commandBox = document.getElementById('command-box-container');
            const submitBtn = document.getElementById('btn-submit-order');

            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty-msg">Tvůj košík je prázdný...</div>';
                document.getElementById('cart-total-price').innerText = "0 $";
                commandBox.style.display = "none";
                submitBtn.disabled = true;
                return;
            }

            container.innerHTML = cart.map((item) => `
                <div class="cart-item">
                    <img class="cart-item-img" src="${item.img}">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name} (${item.quantity}x)</div>
                        <div class="cart-item-price">${item.price * item.quantity} $</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${item.id})">✕</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total-price').innerText = total + " $";
            document.getElementById('command-code').innerText = `/paybusiness EaZ_market ${total} 0`;
            commandBox.style.display = "block";
            submitBtn.disabled = false;
        }

        function copyCommand() {
            navigator.clipboard.writeText(document.getElementById('command-code').innerText);
            alert("Příkaz zkopírován do schránky!");
        }

        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            if (data.success) {
                return data.data.url; 
            } else {
                throw new Error("ImgBB Upload Failed");
            }
        }

        async function handleCheckout(e) {
            e.preventDefault();

            const nick = document.getElementById('player-name').value;
            const coords = document.getElementById('player-coords').value;
            const fileInput = document.getElementById('player-proof');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const itemsList = cart.map(item => `- ${item.name} (${item.quantity}x)`).join('\n');

            const submitBtn = document.getElementById('btn-submit-order');
            submitBtn.innerText = "NAHRÁVÁM OBRÁZEK...";
            submitBtn.disabled = true;

            let uploadedImageUrl = "Obrázek nebyl nahrán.";

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                try {
                    uploadedImageUrl = await uploadToImgBB(file);
                } catch (err) {
                    console.error(err);
                    alert("Selhalo nahrávání obrázku na úložiště. Zkontroluj klíč ImgBB.");
                    submitBtn.innerText = "ODESLAT OBJEDNÁVKU";
                    submitBtn.disabled = false;
                    return;
                }
            }

            submitBtn.innerText = "ODESÍLÁM NA DISCORD...";

            const discordPayload = {
                content: "🔔 **Nová objednávka v EaZ marketu!**",
                embeds: [{
                    title: "🛒 Podrobnosti objednávky",
                    color: 5814783,
                    fields: [
                        { name: "👤 Hráč (Nick)", value: nick, inline: true },
                        { name: "📍 Souřadnice", value: coords, inline: true },
                        { name: "💰 Celková cena", value: total + " $", inline: true },
                        { name: "📦 Zakoupené položky", value: itemsList, inline: false },
                        { name: "⌨️ Příkaz platby", value: `\`/paybusiness EaZ_market ${total} 0\``, inline: false },
                        { name: "🖼️ Screenshot platby", value: `[Otevřít obrázek v plné kvalitě](${uploadedImageUrl})`, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const discordResponse = await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(discordPayload)
                });

                if (discordResponse.ok || discordResponse.status === 204) {
                    alert('Objednávka byla úspěšně odeslána na Discord! Jakmile platbu zkontroluji, věci ti doručím.');
                    cart = [];
                    updateCartUI();
                    document.getElementById('checkout-form').reset();
                    toggleCart();
                } else {
                    throw new Error("Discord Webhook Failed");
                }
            } catch (error) {
                console.error('FAILED...', error);
                alert('Chyba odesílání na Discord. Zkontroluj správnost URL adresy webhooku.');
            } finally {
                submitBtn.innerText = "ODESLAT OBJEDNÁVKU";
                submitBtn.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderProducts();
            updateCartUI();
        });
    </script>
</body>
</html>
